<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meghdut</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="style.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=Outfit:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
</head>

<body class="min-h-screen text-white overflow-x-hidden">

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div
    class="relative z-10 min-h-screen flex flex-col items-center px-5 sm:px-8 md:px-10 pt-10 sm:pt-14 md:pt-16 lg:pt-20 pb-16">
    <div class="w-full max-w-sm sm:max-w-xl md:max-w-2xl lg:max-w-3xl xl:max-w-4xl">

      <div class="mb-10 sm:mb-12 md:mb-14 fade-up" style="animation-delay:0s">
        <p class="label-text mb-2">Weather</p>
        <h1 class="display-font text-5xl sm:text-6xl md:text-7xl font-medium tracking-tight">Meghdut</h1>
      </div>

      <div class="mb-10 sm:mb-12 md:mb-14 fade-up" style="animation-delay:0.08s">
        <div class="search-wrap">
          <input id="cityInput" type="text" placeholder="Enter city name" class="search-field"
            onkeydown="if(event.key==='Enter') fetchWeather()" autocomplete="off" />
          <button onclick="fetchWeather()" class="search-arrow" aria-label="Search">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12" />
              <polyline points="12 5 19 12 12 19" />
            </svg>
          </button>
        </div>
        <p id="errorMsg" class="hidden mt-3 text-red-400/80 text-sm font-light"></p>
      </div>



    </div>
  </div>

  <script src="config.js"></script>
  <script src="index.js"></script>
</body>

</html>
